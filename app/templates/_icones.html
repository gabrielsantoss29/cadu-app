{# Ícones em SVG (traço). Uso: {{ icone('casa') }}. O mesmo conjunto existe em static/app.js para o JavaScript. #}
{% macro icone(nome, classe='h-6 w-6') -%}
<svg class="{{ classe }} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if nome == 'casa' %}<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>
{%- elif nome == 'presente' %}<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>

{%- elif nome == 'conversa' %}<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
{%- elif nome == 'mais' %}<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>

{%- elif nome == 'cadeado' %}<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
{%- elif nome == 'link' %}<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
{%- elif nome == 'cadeado-aberto' %}<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>
{%- elif nome == 'refazer' %}<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>

{%- elif nome == 'check' %}<path d="M20 6 9 17l-5-5"/>

{%- elif nome == 'x' %}<path d="M18 6 6 18"/><path d="m6 6 12 12"/>
{%- elif nome == 'documento' %}<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v5h5"/><path d="M8 13h8M8 17h8"/>
{%- endif %}
</svg>
